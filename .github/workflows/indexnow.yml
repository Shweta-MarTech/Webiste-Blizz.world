# Tell IndexNow (Bing, Yandex, Seznam…) about new or changed pages after each
# successful Vercel production deploy. See scripts/indexnow.mjs.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL, not just changed ones"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore page fingerprints from the last run
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-cache
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Submit new and changed URLs
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}

      - name: Save page fingerprints for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexnow-cache
          key: indexnow-${{ github.run_id }}
